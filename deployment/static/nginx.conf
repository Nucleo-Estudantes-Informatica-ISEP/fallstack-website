server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-store" always;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  location = / { try_files /index.html =404; }
  location = /sw.js { try_files /sw.js =404; }
  location = /landing.js { try_files /landing.js =404; }
  location = /landing.css { try_files /landing.css =404; }
  location = /assets/logo.png { try_files $uri =404; }
  location = /assets/nei.png { try_files $uri =404; }
  location / { return 404; }
}
