# TLS must terminate here (TCP passthrough at any outer load balancer).
server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /run/staff/tls.crt;
  ssl_certificate_key /run/staff/tls.key;
  ssl_client_certificate /run/staff/staff-ca.crt;
  ssl_crl /run/staff/staff-ca.crl;
  ssl_verify_client on;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;

  location = / {
    return 302 /overview;
  }
  # Existing admin pages and the role-gated staff scanner only.
  location ~ ^/(overview|actions|admin-saved|admins|attendance|companies|employees|faqs|giveaway|interests|scans|schedule|sponsors|statistics|storage|students)(/|$) {
    proxy_pass http://web:4000;
  }
  location /api/admin/ {
    proxy_pass http://web:4000;
  }
  # OIDC/session endpoints, not signup or other public auth flows.
  location ~ ^/(login|api/auth/(login|logout|session|callback/zitadel))$ {
    proxy_pass http://web:4000;
  }
  location ~ ^/api/sessions/[^/]+/check-ins(/count)?$ {
    proxy_pass http://web:4000;
  }
  # Backoffice QR refresh/toggle; student action completion stays unavailable.
  location ~ ^/api/actions/[^/]+$ {
    limit_except GET PATCH { deny all; }
    proxy_pass http://web:4000;
  }
  location ~ ^/(api/students/[^/]+/cv/file|_next/image|favicon\.ico)$ {
    limit_except GET { deny all; }
    proxy_pass http://web:4000;
  }
  location ~ ^/(_next/static/|assets/|api/media/(avatar|logo|video)/) {
    limit_except GET { deny all; }
    proxy_pass http://web:4000;
  }
  location / {
    return 404;
  }
}
