[agent]
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = true
  metric_batch_size = 1000
  metric_buffer_limit = 2000

[[outputs.prometheus_client]]
  listen = "127.0.0.1:9273"
  expiration_interval = "45s"
  string_as_label = false
  collectors_exclude = ["gocollector", "process"]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  container_state_include = ["running", "restarting", "exited", "dead", "paused"]
  docker_label_include = ["metrics_environment", "metrics_service"]
  tag_env = []
  perdevice_include = []
  total_include = ["cpu"]
  namepass = ["docker_container_cpu", "docker_container_mem", "docker_container_status", "docker_container_health"]
  fieldinclude = ["usage_percent", "usage", "limit", "restart_count", "oomkilled", "started_at", "health_status", "failing_streak"]
  taginclude = ["metrics_environment", "metrics_service", "container_name", "container_status", "cpu"]
  # tagpass combines keys with OR; this guarded expression requires both labels.
  metricpass = 'has(tags.metrics_environment) && tags.metrics_environment in ["dev", "main", "shared"] && has(tags.metrics_service) && tags.metrics_service in ["web", "proxy", "authnei", "postgresql", "redis", "minio", "storage-cleanup"]'

[[processors.rename]]
  [[processors.rename.replace]]
    tag = "metrics_environment"
    dest = "environment"
  [[processors.rename.replace]]
    tag = "metrics_service"
    dest = "service"
  [[processors.rename.replace]]
    tag = "container_name"
    dest = "copy"

# Reuse authenticated Redis PONG healthchecks without credentials or key access.
[[processors.enum]]
  namepass = ["docker_container_health"]
  [[processors.enum.mapping]]
    fields = ["health_status"]
    dest = "healthy"
    default = 0
    [processors.enum.mapping.value_mappings]
      healthy = 1
      unhealthy = 0
      starting = 0

# Read aggregate connection counts, never pg_stat_activity/query text or rows.
[[inputs.postgresql]]
  address = "${METRICS_PG_DSN}"
  outputaddress = "postgresql"
  databases = ["${METRICS_PG_DEV_DATABASE}"]
  fieldinclude = ["numbackends", "deadlocks", "xact_commit", "xact_rollback"]
  taginclude = ["db", "environment", "service"]
  [inputs.postgresql.tags]
    environment = "dev"
    service = "postgresql"

[[inputs.postgresql]]
  address = "${METRICS_PG_DSN}"
  outputaddress = "postgresql"
  databases = ["${METRICS_PG_MAIN_DATABASE}"]
  fieldinclude = ["numbackends", "deadlocks", "xact_commit", "xact_rollback"]
  taginclude = ["db", "environment", "service"]
  [inputs.postgresql.tags]
    environment = "main"
    service = "postgresql"

[[inputs.postgresql]]
  address = "${METRICS_PG_DSN}"
  outputaddress = "postgresql"
  databases = ["${METRICS_PG_AUTH_DATABASE}"]
  fieldinclude = ["numbackends", "deadlocks", "xact_commit", "xact_rollback"]
  taginclude = ["db", "environment", "service"]
  [inputs.postgresql.tags]
    environment = "shared"
    service = "authnei-db"

[[inputs.http_response]]
  urls = ["${METRICS_MINIO_HEALTH_URL}"]
  response_timeout = "5s"
  follow_redirects = false
  response_status_code = 200
  fieldinclude = ["response_time", "http_response_code", "result_code", "response_status_code_match"]
  taginclude = ["environment", "service", "probe"]
  [inputs.http_response.tags]
    environment = "shared"
    service = "minio"
    probe = "ready"

[[inputs.http_response]]
  urls = ["${METRICS_AUTH_HEALTH_URL}"]
  response_timeout = "5s"
  follow_redirects = false
  response_status_code = 200
  fieldinclude = ["response_time", "http_response_code", "result_code", "response_status_code_match"]
  taginclude = ["environment", "service", "probe"]
  [inputs.http_response.tags]
    environment = "shared"
    service = "authnei"
    probe = "ready"
