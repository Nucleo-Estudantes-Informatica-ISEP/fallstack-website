# One stack per Linux Docker host, shared by dev/main and AuthNEI.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    user: "65534:${DOCKER_GID:?Set the host Docker socket group ID}"
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus-data:/prometheus
  telegraf:
    image: telegraf:1.36.3-alpine
    network_mode: host
    user: "65534:${DOCKER_GID:?Set the host Docker socket group ID}"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    env_file: .env
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/lib/fallstack-probes:/probes:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  prometheus-data:
