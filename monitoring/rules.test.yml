rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - name: zero errors remains zero and 429 is excluded
    interval: 1m
    input_series:
      - series: 'fallstack_http_request_duration_seconds_count{environment="dev",service="web",copy="web-1",status_code="200"}'
        values: "0+60x6"
      - series: 'fallstack_http_request_duration_seconds_count{environment="dev",service="web",copy="web-1",status_code="429"}'
        values: "0+600x6"
    promql_expr_test:
      - expr: fallstack:copy_http_error_ratio
        eval_time: 5m
        exp_samples:
          - labels: 'fallstack:copy_http_error_ratio{environment="dev",service="web",copy="web-1"}'
            value: 0
  - name: errors include aborted and HTTP failures without mixing copies
    interval: 1m
    input_series:
      - series: 'fallstack_http_request_duration_seconds_count{environment="main",service="web",copy="web-2",status_code="200"}'
        values: "0+54x6"
      - series: 'fallstack_http_request_duration_seconds_count{environment="main",service="web",copy="web-2",status_code="503"}'
        values: "0+3x6"
      - series: 'fallstack_http_request_duration_seconds_count{environment="main",service="web",copy="web-2",status_code="aborted"}'
        values: "0+3x6"
      - series: 'fallstack_http_request_duration_seconds_count{environment="dev",service="web",copy="web-1",status_code="200"}'
        values: "0+60x6"
    promql_expr_test:
      - expr: fallstack:copy_http_error_ratio
        eval_time: 5m
        exp_samples:
          - labels: 'fallstack:copy_http_error_ratio{environment="main",service="web",copy="web-2"}'
            value: 0.1
          - labels: 'fallstack:copy_http_error_ratio{environment="dev",service="web",copy="web-1"}'
            value: 0
  - name: non-200 dependency response alerts
    interval: 1m
    input_series:
      - series: 'http_response_response_status_code_match{environment="shared",service="authnei",probe="ready"}'
        values: "0+0x4"
      - series: 'http_response_result_code{environment="shared",service="authnei",probe="ready"}'
        values: "0+0x4"
    alert_rule_test:
      - alertname: FallstackDependencyProbeFailed
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              environment: shared
              service: authnei
              probe: ready
            exp_annotations:
              summary: MinIO or AuthNEI readiness probe failed
