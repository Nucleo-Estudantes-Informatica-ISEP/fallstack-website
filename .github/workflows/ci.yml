name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_ACCESS_KEY_ID: ci-placeholder
  S3_SECRET_ACCESS_KEY: ${{ github.sha }}
  S3_BUCKET_AVATARS: ci-avatars
  S3_BUCKET_LOGOS: ci-logos
  S3_BUCKET_CVS: ci-cvs
  NEXT_PUBLIC_BASE_URL: https://ci.invalid/api
  JWT_SECRET: ${{ github.sha }}
  AUTH_ISSUER_URL: https://auth.ci.invalid
  AUTH_PROJECT_ID: ci-fallstack-project
  AUTH_GLOBAL_PROJECT_ID: ci-nei-global-project
  AUTH_CLIENT_ID: ci-fallstack-client
  AUTH_CLIENT_SECRET: ${{ github.sha }}
  AUTH_SECRET: ${{ github.sha }}
  AUTH_SCOPES: openid email profile offline_access urn:zitadel:iam:org:projects:roles urn:zitadel:iam:org:project:id:ci-nei-global-project:aud
  AUTH_ROLE_CLAIM: urn:zitadel:iam:org:project:ci-fallstack-project:roles
  AUTH_GLOBAL_ROLE_CLAIM: urn:zitadel:iam:org:project:ci-nei-global-project:roles
  AUTH_REDIRECT_URI: https://ci.invalid/api/auth/callback/zitadel
  AUTH_POST_LOGOUT_REDIRECT_URI: https://ci.invalid
  ZITADEL_ORG_ID: ci-nei-org
  ZITADEL_ROLE_ASSIGNER_TOKEN: ${{ github.sha }}
  GOOGLE_WALLET_NEVER_ENABLED: "true"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Test, typecheck, lint & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify backup cost guards and retention safety
        run: python3 -B -m unittest discover -s scripts/backups -v

      - name: Verify authenticated Redis probe failure handling
        run: bash tests/e2e/redis-probe.sh

      - name: Verify singleton release jobs and web-only scaling
        run: bash tests/e2e/release-workers.sh

      - name: Start isolated authenticated Redis for shared limiter tests
        run: |
          limiter_password="$(openssl rand -hex 32)"
          echo "::add-mask::$limiter_password"
          echo "TEST_REDIS_URL=redis://default:${limiter_password}@127.0.0.1:6379" >> "$GITHUB_ENV"
          docker run -d --name limiter-redis -p 127.0.0.1:6379:6379 \
            redis:7.4.12-alpine redis-server --requirepass "$limiter_password" \
            --appendonly yes --appendfsync everysec --save '' \
            --maxmemory 96mb --maxmemory-policy noeviction
          limiter_ready=false
          for attempt in $(seq 1 15); do
            if reply="$(timeout 2s docker exec -e REDISCLI_AUTH="$limiter_password" limiter-redis redis-cli --raw -e PING)" && [ "$reply" = PONG ]; then
              limiter_ready=true
              break
            fi
            sleep 1
          done
          if [ "$limiter_ready" != true ]; then
            echo "Authenticated CI Redis readiness failed" >&2
            exit 1
          fi

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify bounded multi-process PostgreSQL pools and drain
        env:
          POOL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pool_test
          CONFIRM_ISOLATED_POOL_TEST: "yes"
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres pool_test
          timeout 90s node scripts/check-postgres-pools.mjs

      - name: Test
        run: |
          : "${TEST_REDIS_URL:?Shared limiter integration tests require TEST_REDIS_URL in CI}"
          pnpm exec vitest run --maxWorkers=2

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Test staging redirect safety
        env:
          E2E_BASE_URL: http://127.0.0.1
        run: pnpm test:e2e --project=chromium tests/e2e/playwright/staging-redirects.spec.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build migrator stage
        run: docker build --target migrator -t fallstack-migrator-check .

      - name: Verify migrator runs as non-root
        run: |
          user="$(docker run --rm --entrypoint whoami fallstack-migrator-check)"
          test "$user" = "nextjs"

      - name: Build storage cleanup worker and verify non-root
        run: |
          docker build --target storage-cleanup -t fallstack-storage-cleanup-check .
          test "$(docker inspect --format '{{.Config.User}}' fallstack-storage-cleanup-check)" = "nextjs"

      - name: Verify storage cleanup runtime imports
        run: >-
          docker run --rm --entrypoint node fallstack-storage-cleanup-check
          --conditions=react-server --import tsx
          -e "import('./src/application/services/storageCleanupService.ts')"

      - name: Build production application image
        run: |
          docker build \
            --target runner \
            --build-arg NEXT_PUBLIC_BASE_URL=http://localhost:14000/api \
            -t fallstack-app-check .

      - name: Verify application runs as non-root
        run: test "$(docker inspect --format '{{.Config.User}}' fallstack-app-check)" = "nextjs"

      - name: Verify npm and npx are absent
        run: docker run --rm --entrypoint sh fallstack-app-check -c '! command -v npm && ! command -v npx'

      - name: Scan deployed images for critical and high vulnerabilities
        run: |
          for image in fallstack-app-check fallstack-migrator-check fallstack-storage-cleanup-check; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/" \
              aquasec/trivy:0.76.2 \
              image --scanners vuln --pkg-types os,library --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$image" || exit $?
          done

      - name: Smoke test standalone local Compose stack
        run: bash tests/e2e/local-compose-smoke.sh
