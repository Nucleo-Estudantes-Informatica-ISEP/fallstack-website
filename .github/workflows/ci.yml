name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ${{ github.sha }}
  NEXT_PUBLIC_BASE_URL: https://ci.invalid/api
  JWT_SECRET: ${{ github.sha }}
  AUTH_ISSUER_URL: https://auth.ci.invalid
  AUTH_PROJECT_ID: ci-fallstack-project
  AUTH_GLOBAL_PROJECT_ID: ci-nei-global-project
  AUTH_CLIENT_ID: ci-fallstack-client
  AUTH_CLIENT_SECRET: ${{ github.sha }}
  AUTH_SECRET: ${{ github.sha }}
  AUTH_SCOPES: openid email profile offline_access urn:zitadel:iam:org:projects:roles urn:zitadel:iam:org:project:id:ci-nei-global-project:aud
  AUTH_ROLE_CLAIM: urn:zitadel:iam:org:project:ci-fallstack-project:roles
  AUTH_GLOBAL_ROLE_CLAIM: urn:zitadel:iam:org:project:ci-nei-global-project:roles
  AUTH_REDIRECT_URI: https://ci.invalid/api/auth/callback/zitadel
  AUTH_POST_LOGOUT_REDIRECT_URI: https://ci.invalid
  ZITADEL_ORG_ID: ci-nei-org
  ZITADEL_ROLE_ASSIGNER_TOKEN: ${{ github.sha }}
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Test, typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec vitest run --maxWorkers=2

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build migrator stage
        run: docker build --target migrator -t fallstack-migrator-check .

      - name: Verify migrator runs as non-root
        run: |
          user="$(docker run --rm --entrypoint whoami fallstack-migrator-check)"
          test "$user" = "nextjs"

      - name: Build production application image
        run: |
          docker build \
            --target runner \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder \
            --build-arg NEXT_PUBLIC_BASE_URL=https://ci.invalid/api \
            -t fallstack-app-check .

      - name: Verify application runs as non-root
        run: test "$(docker inspect --format '{{.Config.User}}' fallstack-app-check)" = "nextjs"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: Nucleo-Estudantes-Informatica-ISEP/.github/.github/actions/secret-scan@master
