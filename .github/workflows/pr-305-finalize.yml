name: Finalize PR 305 merge

on:
  push:
    branches:
      - fix/platform-stabilization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply review fixes and conflict resolutions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_regex_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected exactly one regex match in {path}: {pattern!r}")
              p.write_text(updated)

          # Review P1: an Auth lookup failure means confirmation status is unknown.
          # Abort the OAuth linking attempt; only a successful lookup may prove an
          # identity is unconfirmed and eligible for deletion.
          replace_regex_once(
              "src/application/services/authApplicationService.ts",
              r"async function isEmailConfirmed\(id: string\) \{.*?\n\}\n\n(?=// Called from the AuthNEI OAuth callback)",
              '''async function isEmailConfirmed(id: string) {
            const { data, error } = await createAdminClient().auth.admin.getUserById(id);
            if (error || !data.user) {
              const lookupError = error ?? new Error("Existing identity not found");
              reportError(
                lookupError,
                { operation: "authnei_check_email_confirmed" },
                "Failed to look up existing identity's confirmation status"
              );
              throw new HttpError("Unable to verify existing account", 500);
            }
            return Boolean(data.user.email_confirmed_at);
          }

          ''',
              re.S,
          )

          replace_regex_once(
              "src/application/services/authApplicationService.test.ts",
              r'''test\("fails closed \(treats as unconfirmed\) when the admin lookup errors", async \(\) => \{.*?\n\}\);\n\n(?=test\("setAuthUserBanned\(true\))''',
              '''test("aborts without deleting when confirmation status is unknown", async () => {
            vi.mocked(findUserSessionByEmail).mockResolvedValue({
              id: "old-password-id",
              role: "STUDENT",
              adminRole: null,
              student: null,
              employee: null,
            } as never);
            getUserById.mockResolvedValue({
              data: { user: null },
              error: new Error("network error"),
            });

            await expect(
              completeOAuthSignIn({
                id: "new-authnei-id",
                email,
                fallback: "/signup",
              })
            ).rejects.toThrow("Unable to verify existing account");

            expect(deleteAuthUser).not.toHaveBeenCalled();
            expect(deleteUser).not.toHaveBeenCalled();
            expect(deleteUserIfExists).not.toHaveBeenCalled();
            expect(relinkUserId).not.toHaveBeenCalled();
            expect(upsertUser).not.toHaveBeenCalled();
          });

          ''',
              re.S,
          )

          # Review P2: patched transitive versions must stay inside the parent
          # dependency's declared major range.
          replace_once(
              "pnpm-workspace.yaml",
              "  fast-uri@>=3.0.0 <3.1.5: '>=3.1.5'",
              "  fast-uri@>=3.0.0 <3.1.5: 3.1.5",
          )
          replace_once(
              "pnpm-workspace.yaml",
              "  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1'",
              "  js-yaml@>=4.0.0 <4.3.1: 4.3.1",
          )
          replace_once(
              "pnpm-workspace.yaml",
              "  nanoid@<3.3.18: '>=3.3.18'",
              "  nanoid@<3.3.18: 3.3.18",
          )

          # Resolve schema conflict by preserving current dev's CompanyRank work
          # and adding only PR #305's deletion/order constraints.
          replace_once(
              "prisma/schema.prisma",
              "  student Student @relation(fields: [studentId], references: [id])",
              "  student Student @relation(fields: [studentId], references: [id], onDelete: Cascade)",
          )
          replace_once(
              "prisma/schema.prisma",
              "  activity  String\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n}\n\nmodel FaqEntry {",
              "  activity  String\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  @@unique([day, order], map: \"ScheduleEvent_day_order_key\")\n}\n\nmodel FaqEntry {",
          )
          replace_once(
              "prisma/schema.prisma",
              "  order     Int      @default(0)\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n}\n\nmodel SavedStudent {",
              "  order     Int      @unique(map: \"FaqEntry_order_key\") @default(0)\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n}\n\nmodel SavedStudent {",
          )

          # Preserve dev's active-session select while restoring the race-safe
          # idempotent cleanup helper introduced by PR #305.
          replace_once(
              "src/application/repositories/userRepository.ts",
              "export const deleteUser = (id: string, db: DbClient = prisma) =>\n  db.user.delete({ where: { id } });\n\nexport const setUserInterests = (",
              "export const deleteUser = (id: string, db: DbClient = prisma) =>\n  db.user.delete({ where: { id } });\n\nexport const deleteUserIfExists = (id: string, db: DbClient = prisma) =>\n  db.user.deleteMany({ where: { id } });\n\nexport const setUserInterests = (",
          )

          # The only AGENTS.md change made on dev after this PR diverged was the
          # CompanyRank/DB-backed edition guidance. Keep the PR's CI/TDD docs and
          # update that line to dev's current wording.
          replace_regex_once(
              "AGENTS.md",
              r"^- \*\*Edition-specific content\*\*.*$",
              "- **Edition-specific content** still hardcoded (branding, `edition/actions.ts`'s `actionNames`/seed points) is centralized under `src/edition/`. When editing that content for a new event, change `edition/`, not `config/` or `utils/`. Company ranks/profile content (bio, socials, facts, video, display styling) and booth-action linkage are DB-backed instead (`CompanyRank`/`CompanyRankStyle`/`CompanyProfile`/`CompanyDisplayStyle` models, `Action.companyId`), editable through the admin backoffice — `savedStudentService.saveStudent()` now calls `completeCompanyBoothAction()` (`src/application/services/actionService.ts`), which looks up the booth action via `findActionByCompanyId()` instead of the old `edition/actions.ts` name-matching map. Sponsors, FAQ, and the schedule/timetable are likewise DB-backed (`Sponsor`/`FaqEntry`/`ScheduleEvent` models), editable through the admin backoffice — don't add a static `edition/` file for any of these.",
              re.M,
          )
          PY

      - name: Refresh lockfile with compatible overrides
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify focused regression and Prisma schema
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec vitest run src/application/services/authApplicationService.test.ts --maxWorkers=2
          pnpm exec prisma validate

      - name: Commit finalized merge resolution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md pnpm-workspace.yaml pnpm-lock.yaml prisma/schema.prisma \
            src/application/repositories/userRepository.ts \
            src/application/services/authApplicationService.ts \
            src/application/services/authApplicationService.test.ts
          git commit -m "fix: address PR review and resolve dev conflicts"
          git push origin HEAD:fix/platform-stabilization
