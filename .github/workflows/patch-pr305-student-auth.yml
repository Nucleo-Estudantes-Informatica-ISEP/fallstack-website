name: Patch PR305 student auth cleanup

on:
  push:
    branches:
      - fix/platform-stabilization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/platform-stabilization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove student credential mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/application/services/studentService.ts')
          s = p.read_text()
          s = s.replace(
              '  const { password, avatar, active, ...profile } = input;',
              '  const { password: _password, avatar, active, ...profile } = input;'
          )
          block = '''  if (password) {\n    const admin = createAdminClient();\n    const { error } = await admin.auth.admin.updateUserById(id, { password });\n    if (error) throw new HttpError(error.message, 400);\n  }\n'''
          if block not in s:
              raise SystemExit('Expected Supabase Auth password block not found')
          s = s.replace(block, '')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet -- src/application/services/studentService.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/services/studentService.ts
          git commit -m "refactor(auth): stop managing student credentials in Supabase"
          git push origin HEAD:fix/platform-stabilization
