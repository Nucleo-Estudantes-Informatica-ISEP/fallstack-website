x-minio-endpoint: &minio_endpoint ${S3_ENDPOINT:-http://minio-gbheij1ljds8nrhfgdf9teeo:9000}

services:
  redis:
    labels:
      metrics_environment: ${METRICS_ENVIRONMENT:-disabled}
      metrics_service: redis
    image: redis:7.4.12-alpine@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
    restart: unless-stopped
    mem_limit: 256m
    stop_grace_period: 30s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure a unique REDIS_PASSWORD per Coolify environment}
    command:
      - /bin/sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in
          *[!A-Za-z0-9_-]*) echo 'REDIS_PASSWORD must contain only URL-safe letters, digits, underscore or hyphen' >&2; exit 1 ;;
        esac
        umask 077
        # A private non-sticky directory permits root to rewrite the Redis-owned file on restart.
        mkdir -p /run/redis-private
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /run/redis-private/redis.conf
        chown -R redis:redis /run/redis-private
        exec docker-entrypoint.sh redis-server /run/redis-private/redis.conf \
          --bind 127.0.0.1 redis-private \
          --protected-mode yes \
          --appendonly yes --appendfsync everysec --save "" \
          --maxmemory 96mb --maxmemory-policy noeviction
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      redis_private:
        # Bind only this interface, even when Coolify injects a resource network.
        aliases:
          - redis-private

  migrate:
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL in Coolify}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL:?Configure DATABASE_URL in Coolify}}
    networks:
      - default
      - shared_data

  storage-cleanup:
    deploy:
      replicas: 1
    labels:
      metrics_environment: ${METRICS_ENVIRONMENT:-disabled}
      metrics_service: storage-cleanup
    build:
      context: .
      dockerfile: Dockerfile
      target: storage-cleanup
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL in Coolify}
      DIRECT_URL: ${DATABASE_URL:?Configure DATABASE_URL in Coolify}
      S3_ENDPOINT: *minio_endpoint
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Configure S3_ACCESS_KEY_ID in Coolify}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Configure S3_SECRET_ACCESS_KEY in Coolify}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:?Configure S3_BUCKET_AVATARS in Coolify}
      S3_BUCKET_LOGOS: ${S3_BUCKET_LOGOS:?Configure S3_BUCKET_LOGOS in Coolify}
      S3_BUCKET_CVS: ${S3_BUCKET_CVS:?Configure S3_BUCKET_CVS in Coolify}
      # First deployment audits only. Enable after reviewing a staging dry run.
      STORAGE_CLEANUP_MODE: ${STORAGE_CLEANUP_MODE:-dry-run}
    networks:
      - default
      - shared_data

  web:
    # No env scaling knob until #419 verifies Coolify and shared-state safety.
    deploy:
      replicas: 1
    labels:
      metrics_enabled: ${METRICS_ENABLED:-false}
      metrics_environment: ${METRICS_ENVIRONMENT:-disabled}
      metrics_service: web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_URL: ${SENTRY_URL:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-${SERVICE_URL_WEB:-http://localhost:4000}/api}
        NEXT_PUBLIC_LOGS_DASHBOARD_URL: ${NEXT_PUBLIC_LOGS_DASHBOARD_URL:-}
      secrets:
        - sentry_auth_token
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Runtime-only connection contract for #413; never pass these as build args.
      REDIS_URL: redis://:${REDIS_PASSWORD:?Configure a unique REDIS_PASSWORD per Coolify environment}@redis-private:6379
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:?Set fallstack:dev: or fallstack:main: in Coolify}"
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL in Coolify}
      # Coolify injects its runtime .env into every service. Keep migrator credentials out of web.
      DIRECT_URL: ${DATABASE_URL:?Configure DATABASE_URL in Coolify}
      JWT_SECRET: ${JWT_SECRET:-${SERVICE_REALBASE64_64_JWT}}

      # Storage credentials stay server-side; AuthNEI handles login.
      S3_ENDPOINT: *minio_endpoint
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Configure S3_ACCESS_KEY_ID in Coolify}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Configure S3_SECRET_ACCESS_KEY in Coolify}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:?Configure S3_BUCKET_AVATARS in Coolify}
      S3_BUCKET_LOGOS: ${S3_BUCKET_LOGOS:?Configure S3_BUCKET_LOGOS in Coolify}
      S3_BUCKET_CVS: ${S3_BUCKET_CVS:?Configure S3_BUCKET_CVS in Coolify}

      # Direct AuthNEI/ZITADEL OIDC. Only values that identify this concrete
      # ZITADEL application/organization need to be configured in Coolify;
      # stable URLs, generated secrets, scopes and claim names are derived.
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-https://auth.nei-isep.org}
      AUTH_PROJECT_ID: ${AUTH_PROJECT_ID:?Configure AUTH_PROJECT_ID in Coolify}
      AUTH_GLOBAL_PROJECT_ID: ${AUTH_GLOBAL_PROJECT_ID:?Configure AUTH_GLOBAL_PROJECT_ID in Coolify}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:?Configure AUTH_CLIENT_ID in Coolify}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:?Configure AUTH_CLIENT_SECRET in Coolify}
      AUTH_SECRET: ${AUTH_SECRET:-${SERVICE_REALBASE64_64_AUTH}}
      AUTH_SCOPES: ${AUTH_SCOPES:-openid email profile urn:zitadel:iam:org:projects:roles urn:zitadel:iam:org:project:id:${AUTH_PROJECT_ID}:aud urn:zitadel:iam:org:project:id:${AUTH_GLOBAL_PROJECT_ID}:aud}
      AUTH_ROLE_CLAIM: ${AUTH_ROLE_CLAIM:-urn:zitadel:iam:org:project:${AUTH_PROJECT_ID}:roles}
      AUTH_GLOBAL_ROLE_CLAIM: ${AUTH_GLOBAL_ROLE_CLAIM:-urn:zitadel:iam:org:project:${AUTH_GLOBAL_PROJECT_ID}:roles}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-${SERVICE_URL_WEB:-http://localhost:4000}/api/auth/callback/zitadel}
      AUTH_POST_LOGOUT_REDIRECT_URI: ${AUTH_POST_LOGOUT_REDIRECT_URI:-${SERVICE_URL_WEB:-http://localhost:4000}}
      ZITADEL_ORG_ID: ${ZITADEL_ORG_ID:?Configure ZITADEL_ORG_ID in Coolify}
      ZITADEL_ROLE_ASSIGNER_TOKEN: ${ZITADEL_ROLE_ASSIGNER_TOKEN:?Configure ZITADEL_ROLE_ASSIGNER_TOKEN in Coolify}

      # Optional at startup; required together when Google Wallet is enabled.
      GOOGLE_WALLET_NEVER_ENABLED: ${GOOGLE_WALLET_NEVER_ENABLED:-false}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_CLASS_ID: ${GOOGLE_WALLET_CLASS_ID:-}
      GOOGLE_WALLET_SERVICE_ACCOUNT_JSON_B64: ${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON_B64:-}

      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-${SERVICE_URL_WEB:-http://localhost:4000}/api}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_LOGS_DASHBOARD_URL: ${NEXT_PUBLIC_LOGS_DASHBOARD_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-}
      METRICS_HOST: ${METRICS_HOST:-127.0.0.1}
    networks:
      - default
      - shared_data
      - redis_private

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

networks:
  redis_private:
    internal: true
  shared_data:
    external: true
    name: gbheij1ljds8nrhfgdf9teeo

volumes:
  redis_data:
