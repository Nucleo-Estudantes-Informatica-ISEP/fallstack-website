services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FALLSTACK_LOCAL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${FALLSTACK_LOCAL_POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command:
      - redis-server
      - --requirepass
      - ${FALLSTACK_LOCAL_REDIS_PASSWORD:-replace-with-local-redis-secret}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    environment:
      REDIS_PASSWORD: ${FALLSTACK_LOCAL_REDIS_PASSWORD:-replace-with-local-redis-secret}
    ports:
      - "127.0.0.1:${FALLSTACK_LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FALLSTACK_LOCAL_MINIO_ROOT_USER:-fallstack_local}
      MINIO_ROOT_PASSWORD: ${FALLSTACK_LOCAL_MINIO_ROOT_PASSWORD:-replace-with-local-minio-secret}
    ports:
      - "127.0.0.1:${FALLSTACK_LOCAL_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${FALLSTACK_LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # The MinIO image includes mc. Each one-shot service creates one bucket,
  # avoiding a shell dependency in the minimal mc image.
  minio-init-avatars:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/fallstack-dev-avatars"]
    environment:
      MC_HOST_local: "http://${FALLSTACK_LOCAL_MINIO_ROOT_USER:-fallstack_local}:${FALLSTACK_LOCAL_MINIO_ROOT_PASSWORD:-replace-with-local-minio-secret}@minio:9000"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  minio-init-logos:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/fallstack-dev-logos"]
    environment:
      MC_HOST_local: "http://${FALLSTACK_LOCAL_MINIO_ROOT_USER:-fallstack_local}:${FALLSTACK_LOCAL_MINIO_ROOT_PASSWORD:-replace-with-local-minio-secret}@minio:9000"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  minio-init-cvs:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/fallstack-dev-cvs"]
    environment:
      MC_HOST_local: "http://${FALLSTACK_LOCAL_MINIO_ROOT_USER:-fallstack_local}:${FALLSTACK_LOCAL_MINIO_ROOT_PASSWORD:-replace-with-local-minio-secret}@minio:9000"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://postgres:${FALLSTACK_LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:${FALLSTACK_LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?schema=public"
      PRISMA_CONNECTION_LIMIT: "1"
      PRISMA_POOL_TIMEOUT_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy

  storage-cleanup:
    stop_grace_period: 90s
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: Dockerfile
      target: storage-cleanup
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init-avatars:
        condition: service_completed_successfully
      minio-init-logos:
        condition: service_completed_successfully
      minio-init-cvs:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:${FALLSTACK_LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:${FALLSTACK_LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?schema=public"
      PRISMA_CONNECTION_LIMIT: "1"
      PRISMA_POOL_TIMEOUT_SECONDS: "5"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${FALLSTACK_LOCAL_MINIO_ROOT_USER:-fallstack_local}
      S3_SECRET_ACCESS_KEY: ${FALLSTACK_LOCAL_MINIO_ROOT_PASSWORD:-replace-with-local-minio-secret}
      S3_BUCKET_AVATARS: fallstack-dev-avatars
      S3_BUCKET_LOGOS: fallstack-dev-logos
      S3_BUCKET_CVS: fallstack-dev-cvs
      STORAGE_CLEANUP_MODE: ${STORAGE_CLEANUP_MODE:-dry-run}

  web:
    stop_grace_period: 90s
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: "http://localhost:${FALLSTACK_LOCAL_WEB_PORT:-4000}/api"
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_URL: ${SENTRY_URL:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        NEXT_PUBLIC_LOGS_DASHBOARD_URL: ${NEXT_PUBLIC_LOGS_DASHBOARD_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALLSTACK_LOCAL_WEB_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init-avatars:
        condition: service_completed_successfully
      minio-init-logos:
        condition: service_completed_successfully
      minio-init-cvs:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NEXT_MANUAL_SIG_HANDLE: "true"
      DATABASE_URL: "postgresql://postgres:${FALLSTACK_LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:${FALLSTACK_LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres?schema=public"
      PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT:-3}
      PRISMA_POOL_TIMEOUT_SECONDS: ${PRISMA_POOL_TIMEOUT_SECONDS:-5}
      REDIS_URL: "redis://default:${FALLSTACK_LOCAL_REDIS_PASSWORD:-replace-with-local-redis-secret}@redis:6379"
      # The production-built Next.js server validates the deployed prefix set.
      # This Redis is local and isolated; never point it at the shared dev Redis.
      REDIS_KEY_PREFIX: "fallstack:dev:"
      JWT_SECRET: ${JWT_SECRET:-fallstack-local-jwt-secret-change-me-32}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-https://auth.nei-isep.org}
      AUTH_PROJECT_ID: ${AUTH_PROJECT_ID:-fallstack_project_id}
      AUTH_GLOBAL_PROJECT_ID: ${AUTH_GLOBAL_PROJECT_ID:-nei_global_project_id}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-fallstack_oidc_client_id}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-fallstack_oidc_client_secret}
      AUTH_SECRET: ${AUTH_SECRET:-fallstack-local-auth-secret-change-me-32}
      AUTH_SCOPES: "${AUTH_SCOPES:-openid email profile urn:zitadel:iam:org:projects:roles urn:zitadel:iam:org:project:id:${AUTH_PROJECT_ID:-fallstack_project_id}:aud urn:zitadel:iam:org:project:id:${AUTH_GLOBAL_PROJECT_ID:-nei_global_project_id}:aud}"
      AUTH_ROLE_CLAIM: "${AUTH_ROLE_CLAIM:-urn:zitadel:iam:org:project:${AUTH_PROJECT_ID:-fallstack_project_id}:roles}"
      AUTH_GLOBAL_ROLE_CLAIM: "${AUTH_GLOBAL_ROLE_CLAIM:-urn:zitadel:iam:org:project:${AUTH_GLOBAL_PROJECT_ID:-nei_global_project_id}:roles}"
      AUTH_REDIRECT_URI: "http://localhost:${FALLSTACK_LOCAL_WEB_PORT:-4000}/api/auth/callback/zitadel"
      AUTH_POST_LOGOUT_REDIRECT_URI: "http://localhost:${FALLSTACK_LOCAL_WEB_PORT:-4000}"
      ZITADEL_ORG_ID: ${ZITADEL_ORG_ID:-nei_org_id}
      ZITADEL_ROLE_ASSIGNER_TOKEN: ${ZITADEL_ROLE_ASSIGNER_TOKEN:-fallstack_local_role_assigner_token}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${FALLSTACK_LOCAL_MINIO_ROOT_USER:-fallstack_local}
      S3_SECRET_ACCESS_KEY: ${FALLSTACK_LOCAL_MINIO_ROOT_PASSWORD:-replace-with-local-minio-secret}
      S3_BUCKET_AVATARS: fallstack-dev-avatars
      S3_BUCKET_LOGOS: fallstack-dev-logos
      S3_BUCKET_CVS: fallstack-dev-cvs
      GOOGLE_WALLET_NEVER_ENABLED: ${FALLSTACK_LOCAL_GOOGLE_WALLET_NEVER_ENABLED:-true}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_CLASS_ID: ${GOOGLE_WALLET_CLASS_ID:-}
      GOOGLE_WALLET_SERVICE_ACCOUNT_JSON_B64: ${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON_B64:-}
      NEXT_PUBLIC_BASE_URL: "http://localhost:${FALLSTACK_LOCAL_WEB_PORT:-4000}/api"
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_LOGS_DASHBOARD_URL: ${NEXT_PUBLIC_LOGS_DASHBOARD_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: "false"
      METRICS_ENVIRONMENT: ""
      METRICS_HOST: "127.0.0.1"

volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
