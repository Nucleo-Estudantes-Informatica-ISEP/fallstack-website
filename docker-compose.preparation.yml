# Merge with docker-compose.app.yml ONLY on a private staff resource.
# Public domain stays on docker-compose.static.yml with PREPARATION selected.
services:
  storage-cleanup:
    profiles: [retention-daemon]
  web:
    labels:
      traefik.enable: "false"
    ports: !reset []
  staff-gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    volumes:
      - ./deployment/staff.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAFF_TLS_DIRECTORY:?Provide restricted staff TLS certificates}:/run/staff:ro
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      - web
    restart: unless-stopped
